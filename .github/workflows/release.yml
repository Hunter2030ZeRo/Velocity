name: release

on:
  push:
    # One-time publication of the approved installer release.
    branches:
      - 'codex/publish-v0.1.1'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: v0.1.1
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          if [ "$GITHUB_REF" = refs/heads/codex/publish-v0.1.1 ]; then
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists" >&2
              exit 1
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi

          gh release create "$tag" \
            --draft \
            --verify-tag \
            --title "$tag" \
            --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            goarch: amd64
            musl: false
            linker_env: ''
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            goarch: amd64
            musl: true
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goarch: arm64
            musl: false
            linker_env: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            goarch: arm64
            musl: true
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo '${{ matrix.linker_env }}=musl-gcc' >> "$GITHUB_ENV"

      - name: Build release archive
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          cargo build --locked --release --package velocity-resolver --target "$TARGET"

          rm -rf dist
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
            go build -trimpath -ldflags='-s -w' -o dist/velocity ./cmd/velocity
          cp "target/$TARGET/release/velocity-resolver" dist/velocity-resolver
          chmod 755 dist/velocity dist/velocity-resolver

          ./dist/velocity install --help >/dev/null

          asset="velocity-$TARGET.tar.gz"
          tar -C dist -czf "$asset" velocity velocity-resolver
          test -s "$asset"

      - name: Upload Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "$RELEASE_TAG" "velocity-$TARGET.tar.gz" --clobber

  build-windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            goarch: amd64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release archive
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cargo build --locked --release --package velocity-resolver --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item -LiteralPath dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          go build -trimpath -ldflags='-s -w' -o dist/velocity.exe ./cmd/velocity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -LiteralPath "target/$env:TARGET/release/velocity-resolver.exe" -Destination dist/velocity-resolver.exe
          & ./dist/velocity.exe install --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $asset = "velocity-$env:TARGET.zip"
          Compress-Archive -LiteralPath dist/velocity.exe, dist/velocity-resolver.exe -DestinationPath $asset -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $asset) -or (Get-Item -LiteralPath $asset).Length -eq 0) {
            throw "Archive was not created: $asset"
          }

      - name: Upload Windows archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release upload $env:RELEASE_TAG "velocity-$env:TARGET.zip" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download and verify release archives
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" --dir release --pattern 'velocity-*'

          for asset in \
            velocity-x86_64-unknown-linux-gnu.tar.gz \
            velocity-x86_64-unknown-linux-musl.tar.gz \
            velocity-aarch64-unknown-linux-gnu.tar.gz \
            velocity-aarch64-unknown-linux-musl.tar.gz \
            velocity-x86_64-pc-windows-msvc.zip \
            velocity-aarch64-pc-windows-msvc.zip
          do
            test -s "release/$asset" || {
              echo "Missing release asset: $asset" >&2
              exit 1
            }
          done

          cd release
          sha256sum velocity-* | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
