[package]
name = "velocity-resolver"
version = "0.1.0"
description = "Pure dependency resolution core for the Velocity package manager"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["package-manager", "dependency-resolution"]
categories = ["command-line-utilities"]

[dependencies]
bincode = "1.3.3"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zstd = "0.13"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
